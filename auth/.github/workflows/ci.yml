name: CI - Build, Test, SonarCloud and Docker

on:
  push:
    branches: [ "main", "tp4", "tp5-change-password" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test, SonarCloud and Docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # APP_MASTER_KEY est définie dans src/test/resources/application.properties
      # Fallback : clé de test si le secret GitHub n'est pas défini
      - name: Build and run tests (with JaCoCo coverage)
        run: mvn clean verify
        env:
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      # Build Docker image (TP5)
      - name: Build Docker image
        run: docker build -t cdwfs-auth-app .

