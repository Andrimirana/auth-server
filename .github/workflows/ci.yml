name: CI - Build, Test, SonarCloud and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    name: Build, Tests, Quality Gate & Docker
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout du code source
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Requis par SonarCloud pour l'analyse de branches

      # 2. Installation JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Maven (accélère les builds)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('auth/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build, Tests & rapport JaCoCo
      #    Fallback : clé de test utilisée si le secret GitHub n'est pas défini
      - name: Build & Run Tests
        working-directory: ./auth
        env:
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}
        run: mvn -B verify

      # 5. Analyse SonarCloud (bloque si Quality Gate rouge)
      #    sonar.projectKey / sonar.organization / sonar.host.url définis dans pom.xml
      #    SONAR_TOKEN lu automatiquement depuis la variable d'environnement
      - name: SonarCloud Analysis
        working-directory: ./auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      # 6. Build de l'image Docker (TP5)
      #    Échoue si le Dockerfile est invalide ou si le build plante
      - name: Build Docker image
        working-directory: ./auth
        run: docker build -t cdwfs-auth-app .

