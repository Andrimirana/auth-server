# TP4/TP5 - Pipeline CI/CD GitHub Actions
#
# Ce workflow effectue automatiquement :
#   1. Recuperation du code (checkout)
#   2. Installation du JDK 17
#   3. Mise en cache Maven
#   4. Build + Tests JUnit (JaCoCo)  -> BLOQUE si un test echoue
#   5. Analyse SonarCloud            -> BLOQUE si Quality Gate rouge
#   6. Construction image Docker     -> BLOQUE si le build Docker echoue
#
# Secrets a configurer dans GitHub -> Settings -> Secrets and variables -> Actions :
#   SONAR_TOKEN    : token SonarCloud (obligatoire)
#   APP_MASTER_KEY : cle AES (optionnel, fallback fictif si absent)
#
# Valeurs deja definies dans pom.xml :
#   sonar.projectKey   = Andrimirana_auth-server
#   sonar.organization = andrimirana
#   sonar.host.url     = https://sonarcloud.io

name: CI - Build, Test, SonarCloud and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    name: Build, Tests, Quality Gate and Docker
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout (fetch-depth:0 requis par SonarCloud)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. JDK 17 Temurin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Maven
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('auth/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Build + Tests JUnit + JaCoCo
      #    H2 en memoire - pas de MySQL requis en CI
      #    BLOQUE automatiquement si un seul test echoue
      - name: Build and run tests
        working-directory: ./auth
        env:
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}
        run: ./mvnw -B verify

      # 5. Analyse SonarCloud
      #    sonar.qualitygate.wait=true -> BLOQUE si Quality Gate rouge
      - name: SonarCloud Analysis
        working-directory: ./auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY || 'test_master_key_for_ci_only_32chars' }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

      # 6. Build image Docker (TP5)
      #    BLOQUE si le Dockerfile est invalide ou si le build echoue
      #    APP_MASTER_KEY n'est JAMAIS incluse dans l'image
      - name: Build Docker image
        working-directory: ./auth
        run: docker build -t cdwfs-auth-app:${{ github.sha }} .

      # 7. Tag 'latest' sur main uniquement
      - name: Tag Docker image as latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker tag cdwfs-auth-app:${{ github.sha }} cdwfs-auth-app:latest
